# Quando uma etiqueta como v1.0.3 chega ao GitHub, gera os instaladores e publica a versão.
name: Lançar versão
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  versao:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME#v}" --notes "Instale o arquivo .dmg no Mac ou o .exe no Windows."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  instaladores:
    needs: versao
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            alvo: --mac --arm64
          - os: windows-latest
            alvo: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx electron-builder ${{ matrix.alvo }} --publish never
        shell: bash
      - run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" instaladores/*.dmg instaladores/*.exe --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
