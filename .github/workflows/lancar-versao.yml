# Quando uma etiqueta como v1.0.1 chega ao GitHub, gera os instaladores e publica a versão.
name: Lançar versão
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            alvo: --mac --arm64
          - os: windows-latest
            alvo: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - shell: bash
        run: >
          npx electron-builder ${{ matrix.alvo }} --publish always
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
